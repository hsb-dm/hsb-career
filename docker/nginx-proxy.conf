server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # Unknown SNI never completes TLS; a valid SNI with a different Host header is dropped.
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name career.hsb.co.id;
    server_tokens off;

    # Certbot webroot renewals. Not needed when renewing with `certbot --nginx`.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://career.hsb.co.id$request_uri;
    }
}

server {
    # Nginx 1.25.1+ prefers `http2 on;`; this form also works on older releases.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name career.hsb.co.id;
    server_tokens off;

    # ssl_certificate /etc/letsencrypt/live/career.hsb.co.id/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/career.hsb.co.id/privkey.pem;

    # Mozilla "intermediate" profile.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:HsbJobsSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # The app and container Nginx already set X-Frame-Options, nosniff, and Referrer-Policy.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Matches the container's limit (7m) and PHP's post_max_size, so oversized uploads fail here.
    client_max_body_size 7m;
    client_header_timeout 15s;
    client_body_timeout 30s;

    location / {
        proxy_pass http://127.0.0.1:8181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite, never append, client-supplied forwarding headers.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # The container Nginx takes the client IP for rate limiting from this header.
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
