name: hsb-jobs-production

services:
  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-.env.production}
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: postgres
      DB_PORT: "5432"
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      SESSION_SECURE_COOKIE: "true"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - cv-data:/var/www/html/storage/app/private
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/www/html/storage/framework:rw,noexec,nosuid,size=64m,uid=82,gid=82
      - /var/www/html/storage/logs:rw,noexec,nosuid,size=16m,uid=82,gid=82
      - /var/www/html/bootstrap/cache:rw,noexec,nosuid,size=16m,uid=82,gid=82
    read_only: true
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend
      - backend

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8181}:8181"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /var/cache/nginx:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8181/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - frontend

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_DATABASE:?Set DB_DATABASE in .env.production}"
      POSTGRES_USER: "${DB_USERNAME:?Set DB_USERNAME in .env.production}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env.production}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

networks:
  frontend:
  backend:
    internal: true

volumes:
  postgres-data:
  cv-data:
